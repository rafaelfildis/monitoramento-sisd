/* =========================================================================================
   MÓDULO PA — ACOMPANHAMENTO DA EXECUÇÃO POR ÁREA (COSIS / COINFRA / COSTEC / DGIS)
   Fonte: planilha "CONTROLE EXECUCAO PA 2025 2026.xlsx" — 135 ações, ano de referência 2026.
   Nenhum dado ausente na planilha é inventado nesta camada — apenas calculado a partir do
   que foi informado. Todas as fórmulas usadas estão documentadas nas funções abaixo.
========================================================================================= */

/* ---------- Formatação ---------- */
function esc(s){ if(s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtBRL(v){ if(v==null||isNaN(v)) return '—'; return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}); }
function fmtPct(v,dec){ if(v==null||isNaN(v)) return '—'; return (v*100).toFixed(dec==null?1:dec).replace('.',',')+'%'; }
function fmtNum(v){ if(v==null||isNaN(v)) return '—'; return Number(v).toLocaleString('pt-BR'); }
function clamp01(v){ return Math.max(0,Math.min(1,v)); }
function sum(list,key){ return list.reduce((a,x)=>a+(Number(x[key])||0),0); }

/* ---------- Extração de processo/observação a partir do texto livre da planilha ---------- */
const PA_PROCESSO_RE = /\d{2,3}\.\d{3,4}\.\d{4}\.\d{6,7}-\d{2}/g;
function paExtractProcesso(raw){
  if(!raw) return null;
  const s = String(raw).trim();
  const m = s.match(PA_PROCESSO_RE);
  return (m && m.length) ? m.join(' / ') : null;
}
function paExtractObs(raw){
  if(!raw) return null;
  const s = String(raw).trim();
  if(/^PENDENTE$/i.test(s)) return null;
  const rest = s.replace(PA_PROCESSO_RE,'').replace(/[\/,;\s]+/g,'');
  return rest.length ? s : null;
}

/* ---------- Derivação por ação ----------
   status oficiais (legenda da própria planilha, aba "Planilha2"):
   PENDENTE=amarelo · EM EXECUÇÃO=laranja · EXECUTADO=verde · CANCELADO=vermelho
   EXECUÇÃO PARCIAL sem cor definida na planilha — usamos azul para diferenciar de "em execução". */
function paDerive(it){
  const status = (it.status||'').trim().toUpperCase();
  const cancelado = status==='CANCELADO';
  const pendente = status==='PENDENTE';
  const emExecucao = status==='EM EXECUÇÃO';
  const parcial = status==='EXECUÇÃO PARCIAL';
  const executado = status==='EXECUTADO';
  const oficial = executado || parcial; // 3.1 — status que contam como execução financeira oficial

  const valorPlanejado = Number(it.valorPlanejado)||0;
  const valorExecutadoBruto = it.valorExecutado!=null ? Number(it.valorExecutado) : 0;
  const valorExecutadoOficial = oficial ? valorExecutadoBruto : 0;

  const qtdPlanejada = it.qtdPlanejada!=null ? Number(it.qtdPlanejada) : null;
  const qtdExecutada = it.qtdExecutada!=null ? Number(it.qtdExecutada) : null;
  const fisicaValida = qtdPlanejada!=null && qtdPlanejada>0 && qtdExecutada!=null; // 3.7.2
  const fisicaPct = fisicaValida ? qtdExecutada/qtdPlanejada : null; // 3.6
  const fisicaExcedida = fisicaValida && qtdExecutada>qtdPlanejada;

  const processo = paExtractProcesso(it.observacaoBruta);
  const observacao = paExtractObs(it.observacaoBruta);
  const categoria = (it.categoria && it.categoria!=='Não informado') ? it.categoria : null;
  const financeiraExcedida = valorPlanejado>0 && valorExecutadoBruto>valorPlanejado;

  const inconsistencias = [];
  if(!cancelado && valorExecutadoBruto>0 && !oficial) inconsistencias.push(`Status "${status}" com valor executado informado`);
  if(executado && valorExecutadoBruto<=0) inconsistencias.push('Status "EXECUTADO" sem valor executado informado');
  if(financeiraExcedida) inconsistencias.push('Valor executado superior ao valor planejado');
  if(fisicaExcedida) inconsistencias.push('Quantidade executada superior à quantidade planejada');
  if(cancelado && valorExecutadoBruto>0) inconsistencias.push('Ação cancelada com valor executado informado');
  if(!processo && !cancelado) inconsistencias.push('Sem número de processo informado');
  if(!categoria) inconsistencias.push('Sem categoria/objeto da aquisição informado');

  return Object.assign({}, it, {
    status, cancelado, pendente, emExecucao, parcial, executado, oficial,
    valorPlanejado, valorExecutadoBruto, valorExecutadoOficial,
    qtdPlanejada, qtdExecutada, fisicaValida, fisicaPct, fisicaExcedida,
    processo, observacao, categoria, financeiraExcedida,
    inconsistencias, temInconsistencia: inconsistencias.length>0,
    impactoFinanceiro: inconsistencias.length>0 ? valorPlanejado : 0
  });
}
const PA = PA_DATA.map(paDerive);
const PA_AREAS = ['COSIS','COINFRA','COSTEC','DGIS'];
const PA_AREA_COLOR = { COSIS:'var(--accent)', COINFRA:'var(--blue-600)', COSTEC:'var(--navy-700)', DGIS:'var(--amber)' };
const PA_STATUS_ORDER = ['PENDENTE','EM EXECUÇÃO','EXECUÇÃO PARCIAL','EXECUTADO','CANCELADO'];
const PA_STATUS_COLOR = {
  'PENDENTE':          {bg:'var(--amber-100)',  fg:'var(--amber)',   dot:'var(--amber)'},
  'EM EXECUÇÃO':       {bg:'var(--orange-100)', fg:'var(--orange)',  dot:'var(--orange)'},
  'EXECUÇÃO PARCIAL':  {bg:'var(--blue-100)',   fg:'var(--blue-600)',dot:'var(--blue-600)'},
  'EXECUTADO':         {bg:'var(--green-100)',  fg:'var(--green)',   dot:'var(--green)'},
  'CANCELADO':         {bg:'var(--red-100)',    fg:'var(--red)',     dot:'var(--red)'}
};
function paStatusTag(s){ const c=PA_STATUS_COLOR[s]||PA_STATUS_COLOR['PENDENTE']; return `<span class="status-tag" style="background:${c.bg};color:${c.fg}"><span class="dot" style="background:${c.dot}"></span>${s}</span>`; }
function paItemsArea(area){ return PA.filter(x=>x.area===area); }

/* ---------- Configuração — editável em Configurações ---------- */
function paDefaultConfig(){
  return {
    faixasExecucao: [
      {max:0.10, label:'Crítica',   color:'var(--red)'},
      {max:0.30, label:'Baixa',     color:'var(--orange)'},
      {max:0.60, label:'Moderada',  color:'var(--amber)'},
      {max:0.90, label:'Avançada',  color:'var(--blue-600)'},
      {max:1.0001, label:'Concluída', color:'var(--green)'}
    ],
    pesosIndice: { execFinanceira:0.40, iniciadas:0.25, concluidas:0.20, qualidade:0.10, regularidade:0.05 },
    pesosRisco: { valorAlto:30, pendente:20, semExecucao:15, semProcesso:10, inconsistenciaFinanceira:15, dadosIncompletos:10 },
    faixasRisco: [ {max:25,label:'Baixo',color:'var(--green)'}, {max:50,label:'Moderado',color:'var(--amber)'}, {max:75,label:'Alto',color:'var(--orange)'}, {max:Infinity,label:'Crítico',color:'var(--red)'} ],
    valorAltoLimiar: 2000000,
    semaforo: { verdeMin:60, amareloMin:30, pendentesAltoPct:0.5, inconsistenciasAlerta:3 }
  };
}
let PA_CONFIG = paDefaultConfig();

/* ---------- Indicadores por área (seção "Indicadores por área" + fórmulas 3.x) ---------- */
function paAreaStats(area){
  const items = paItemsArea(area);
  const ativas = items.filter(x=>!x.cancelado);
  const canceladas = items.filter(x=>x.cancelado);
  const pendentes = items.filter(x=>x.pendente);
  const emExecucao = items.filter(x=>x.emExecucao);
  const parcial = items.filter(x=>x.parcial);
  const executadas = items.filter(x=>x.executado);
  const comExecucao = items.filter(x=>x.valorExecutadoBruto>0);
  const iniciadas = items.filter(x=>x.emExecucao||x.parcial||x.executado); // 3.3

  const valorPlanejadoTotal = sum(items,'valorPlanejado');
  const valorPlanejadoAtivas = sum(ativas,'valorPlanejado');
  const valorPlanejadoCanceladas = sum(canceladas,'valorPlanejado');
  const valorExecOficial = sum(items,'valorExecutadoOficial');
  const valorExecBruto = sum(items,'valorExecutadoBruto');
  const saldoAExecutar = valorPlanejadoAtivas - valorExecOficial; // planejado das ações ativas menos executado oficial

  const pctExecOficial = valorPlanejadoTotal>0 ? valorExecOficial/valorPlanejadoTotal : 0;   // 3.1
  const pctExecAjustada = valorPlanejadoAtivas>0 ? valorExecOficial/valorPlanejadoAtivas : 0; // 3.2
  const pctIniciadas = ativas.length ? iniciadas.length/ativas.length : 0;   // 3.3
  const pctConcluidas = ativas.length ? executadas.length/ativas.length : 0; // 3.4
  const pctPendentes = ativas.length ? pendentes.length/ativas.length : 0;   // 3.5

  const validFisica = ativas.filter(x=>x.fisicaValida);
  const coberturaFisica = ativas.length ? validFisica.length/ativas.length : 0; // 3.7
  const fisicaMedia = validFisica.length ? validFisica.reduce((a,x)=>a+Math.min(x.fisicaPct,1),0)/validFisica.length : null;
  const fisicaAlertas = validFisica.filter(x=>x.fisicaExcedida).length;

  const comInconsistencia = items.filter(x=>x.temInconsistencia);
  const impactoInconsistencias = sum(comInconsistencia,'impactoFinanceiro');
  const semProcesso = items.filter(x=>!x.processo && !x.cancelado).length;
  const semCategoria = items.filter(x=>!x.categoria).length;
  // proxy de "sem atualização adequada": ação não cancelada, em andamento (pendente/em execução) e sem qualquer
  // rastro de processo ou observação registrado — não há campo de data na planilha-fonte para medir isso diretamente.
  const semAtualizacao = items.filter(x=>!x.cancelado && !x.processo && !x.observacao && (x.pendente||x.emExecucao)).length;

  return { area, totalAcoes:items.length, ativas:ativas.length, canceladas:canceladas.length,
    pendentes:pendentes.length, emExecucao:emExecucao.length, parcial:parcial.length, executadas:executadas.length,
    comExecucao:comExecucao.length, iniciadas:iniciadas.length,
    valorPlanejadoTotal, valorPlanejadoAtivas, valorPlanejadoCanceladas, valorExecOficial, valorExecBruto, saldoAExecutar,
    pctExecOficial, pctExecAjustada, pctIniciadas, pctConcluidas, pctPendentes,
    coberturaFisica, fisicaMedia, fisicaValidasN:validFisica.length, fisicaAlertas,
    inconsistencias:comInconsistencia.length, impactoInconsistencias, semProcesso, semCategoria, semAtualizacao,
    items };
}
function paTotalStats(){
  const all = PA_AREAS.map(paAreaStats);
  const g = k => all.reduce((a,s)=>a+s[k],0);
  const valorPlanejadoTotal=g('valorPlanejadoTotal'), valorPlanejadoAtivas=g('valorPlanejadoAtivas'), valorExecOficial=g('valorExecOficial');
  return { area:'Total', totalAcoes:g('totalAcoes'), ativas:g('ativas'), canceladas:g('canceladas'),
    pendentes:g('pendentes'), emExecucao:g('emExecucao'), parcial:g('parcial'), executadas:g('executadas'),
    comExecucao:g('comExecucao'), iniciadas:g('iniciadas'),
    valorPlanejadoTotal, valorPlanejadoAtivas, valorPlanejadoCanceladas:g('valorPlanejadoCanceladas'),
    valorExecOficial, valorExecBruto:g('valorExecBruto'), saldoAExecutar:g('saldoAExecutar'),
    pctExecOficial: valorPlanejadoTotal>0?valorExecOficial/valorPlanejadoTotal:0,
    pctExecAjustada: valorPlanejadoAtivas>0?valorExecOficial/valorPlanejadoAtivas:0,
    pctIniciadas: g('ativas')?g('iniciadas')/g('ativas'):0,
    pctConcluidas: g('ativas')?g('executadas')/g('ativas'):0,
    pctPendentes: g('ativas')?g('pendentes')/g('ativas'):0,
    inconsistencias:g('inconsistencias'), impactoInconsistencias:g('impactoInconsistencias'),
    semProcesso:g('semProcesso'), semCategoria:g('semCategoria'), semAtualizacao:g('semAtualizacao') };
}

/* ---------- Faixa de execução financeira (seção 4) ---------- */
function paFaixa(pct){
  for(const f of PA_CONFIG.faixasExecucao) if(pct<=f.max) return f;
  return PA_CONFIG.faixasExecucao[PA_CONFIG.faixasExecucao.length-1];
}

/* ---------- Índice de desempenho da execução (seção 5) ---------- */
function paIndice(area){
  const s = paAreaStats(area);
  const qualidade = 1 - clamp01((s.semProcesso + s.semCategoria) / Math.max(s.totalAcoes,1));
  const regularidade = 1 - clamp01(s.semAtualizacao / Math.max(s.ativas,1));
  const P = PA_CONFIG.pesosIndice;
  const componentes = [
    {label:'Execução financeira ajustada', peso:P.execFinanceira, valor:s.pctExecAjustada, pontos: clamp01(s.pctExecAjustada)*P.execFinanceira*100},
    {label:'Ações iniciadas',              peso:P.iniciadas,      valor:s.pctIniciadas,     pontos: clamp01(s.pctIniciadas)*P.iniciadas*100},
    {label:'Ações concluídas',             peso:P.concluidas,     valor:s.pctConcluidas,    pontos: clamp01(s.pctConcluidas)*P.concluidas*100},
    {label:'Qualidade dos dados',          peso:P.qualidade,      valor:qualidade,          pontos: qualidade*P.qualidade*100},
    {label:'Regularidade dos registros',   peso:P.regularidade,   valor:regularidade,       pontos: regularidade*P.regularidade*100}
  ];
  const bruto = componentes.reduce((a,c)=>a+c.pontos,0);

  const penalidades = [];
  const add=(n,label,peso)=>{ if(n>0) penalidades.push({label:`${n} ${label}`, pontos:n*peso}); };
  add(s.items.filter(x=>x.pendente && x.valorExecutadoBruto>0).length, 'ação(ões) pendente(s) com valor executado', 2);
  add(s.items.filter(x=>x.executado && x.valorExecutadoBruto<=0).length, 'ação(ões) executada(s) sem valor informado', 2);
  add(s.items.filter(x=>x.financeiraExcedida).length, 'ação(ões) com valor executado acima do planejado', 3);
  add(s.items.filter(x=>x.fisicaExcedida).length, 'ação(ões) com quantidade executada acima da planejada', 2);
  add(s.semCategoria, 'ação(ões) sem categoria', 1);
  add(s.semProcesso, 'ação(ões) sem processo', 1);

  const totalPenalidade = Math.min(30, penalidades.reduce((a,p)=>a+p.pontos,0));
  const final = Math.max(0, Math.min(100, bruto - totalPenalidade));
  return { final, bruto, componentes, penalidades, totalPenalidade };
}

/* ---------- Semáforo gerencial (seção 6) ---------- */
const PA_SEMAFORO_META = {
  verde:{fg:'var(--green)',bg:'var(--green-100)',icon:'✓',label:'Situação regular'},
  amarelo:{fg:'var(--amber)',bg:'var(--amber-100)',icon:'!',label:'Atenção necessária'},
  vermelho:{fg:'var(--red)',bg:'var(--red-100)',icon:'✕',label:'Situação crítica'}
};
function paSemaforo(area){
  const s = paAreaStats(area);
  const idx = paIndice(area).final;
  const cfg = PA_CONFIG.semaforo;
  let cor;
  if(idx>=cfg.verdeMin && s.pctPendentes<=cfg.pendentesAltoPct && s.inconsistencias<=cfg.inconsistenciasAlerta) cor='verde';
  else if(idx>=cfg.amareloMin) cor='amarelo';
  else cor='vermelho';
  const meta = PA_SEMAFORO_META[cor];
  const fatores = [
    `execução financeira ajustada de ${fmtPct(s.pctExecAjustada)}`,
    `${fmtPct(s.pctPendentes)} das ações ativas pendentes`,
    `${fmtBRL(s.saldoAExecutar)} ainda não executados`
  ];
  if(s.inconsistencias) fatores.push(`${s.inconsistencias} inconsistência(s) identificada(s)`);
  if(s.executadas===0 && s.ativas>0) fatores.push('nenhuma ação concluída até o momento');
  const justificativa = `${meta.label}: ${fatores.join(', ')}.`;
  return { cor, meta, justificativa, fatores, indice:idx };
}

/* ---------- Pontuação de risco por ação (seção 10) ---------- */
function paRiskScore(x){
  const P = PA_CONFIG.pesosRisco;
  let score=0; const motivos=[];
  if(x.valorPlanejado >= PA_CONFIG.valorAltoLimiar){ score+=P.valorAlto; motivos.push(`Alto valor planejado (${fmtBRL(x.valorPlanejado)})`); }
  if(x.pendente){ score+=P.pendente; motivos.push('Status pendente'); }
  if(!x.cancelado && x.valorExecutadoBruto<=0){ score+=P.semExecucao; motivos.push('Nenhuma execução financeira registrada'); }
  if(!x.processo && !x.cancelado){ score+=P.semProcesso; motivos.push('Ausência de processo informado'); }
  if(x.financeiraExcedida){ score+=P.inconsistenciaFinanceira; motivos.push('Valor executado superior ao planejado'); }
  else if(x.temInconsistencia && x.valorExecutadoBruto>0 && !x.oficial && !x.cancelado){ score+=P.inconsistenciaFinanceira; motivos.push('Valor executado incompatível com o status'); }
  if(x.cancelado && x.valorExecutadoBruto>0){ score+=P.inconsistenciaFinanceira; motivos.push('Ação cancelada com valor executado'); }
  if(!x.categoria || (!x.observacao && !x.processo && !x.cancelado)){ score+=P.dadosIncompletos; motivos.push('Dados de preenchimento incompletos'); }
  score = Math.min(100, Math.round(score));
  const faixa = PA_CONFIG.faixasRisco.find(f=>score<=f.max) || PA_CONFIG.faixasRisco[PA_CONFIG.faixasRisco.length-1];
  return { score, faixa, motivos };
}
function paAcoesAtencao(area, limit){
  const items = paItemsArea(area).filter(x=>!x.cancelado).map(x=>Object.assign({}, x, {risco: paRiskScore(x)}));
  items.sort((a,b)=>b.risco.score-a.risco.score);
  return items.filter(x=>x.risco.score>0).slice(0, limit||8);
}

/* ---------- Resumo executivo automático (seção 11) — gerado só a partir dos indicadores calculados ---------- */
function paTopInconsistenciaTipos(area){
  const items = paItemsArea(area).filter(x=>x.temInconsistencia);
  const counts = {};
  items.forEach(x=>x.inconsistencias.forEach(m=>{ const key=m.split('(')[0].trim().toLowerCase(); counts[key]=(counts[key]||0)+1; }));
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>k);
  return top.length ? top.join(' e ') : 'preenchimento incompleto';
}
function paResumo(area){
  const s = paAreaStats(area);
  const principais = s.inconsistencias>0
    ? ` Foram identificadas ${s.inconsistencias} inconsistência(s), sendo as principais relacionadas a ${paTopInconsistenciaTipos(area)}.`
    : ' Não foram identificadas inconsistências nos dados desta área.';
  return `A ${area} possui ${s.totalAcoes} ação(ões), com valor total planejado de ${fmtBRL(s.valorPlanejadoTotal)}. `
    + `Atualmente, ${s.emExecucao} ação(ões) estão em execução, ${s.pendentes} estão pendentes, ${s.executadas} foram executadas, `
    + `${s.parcial} possuem execução parcial e ${s.canceladas} foram canceladas. `
    + `A execução financeira oficial é de ${fmtPct(s.pctExecOficial)} sobre o planejamento total`
    + ` (${fmtPct(s.pctExecAjustada)} considerando apenas as ações ativas), restando ${fmtBRL(s.saldoAExecutar)} a executar.`
    + principais;
}

function paKpiCard(o){
  const tone = o.tone||'neutral';

  return `<div class="kpi-card tone-${tone}" style="--kc:${toneColor}" ${o.tooltip?`title="${esc(o.tooltip)}"`:''} ${o.nav?`data-nav="${o.nav}"`:''}>

  </div>`;
}
function paCompareLine(val,avg,fmtFn){
  if(avg==null||isNaN(avg)) return '';
  const diff = val-avg;
  const arrow = diff>0.0001?'▲':diff<-0.0001?'▼':'▬';
  return `<div class="kpi-compare">Média das demais áreas: <strong>${fmtFn(avg)}</strong> &nbsp;${arrow} ${fmtFn(Math.abs(diff))}</div>`;
}
function paOtherAreasAvg(area,getter){
  const others = PA_AREAS.filter(a=>a!==area).map(a=>getter(paAreaStats(a)));

}

function paStackBar(items,total){

function paRowDerivedSort(x,col){
  if(col==='saldo') return x.valorPlanejado - x.valorExecutadoOficial;
  if(col==='pctFin') return x.valorPlanejado>0 ? x.valorExecutadoOficial/x.valorPlanejado : -1;
  return x[col];
}
function paMatchesQuick(x){
  const st = state.pa;
  if(st.area && x.area!==st.area) return false;
  if(st.status && x.status!==st.status) return false;
  if(st.semProcesso && (x.processo || x.cancelado)) return false;
  if(st.comInconsistencia && !x.temInconsistencia) return false;
  if(st.valorAlto && !(x.valorPlanejado >= PA_CONFIG.valorAltoLimiar)) return false;
  if(st.saldoTotal && !(!x.cancelado && x.valorExecutadoBruto<=0 && x.valorPlanejado>0)) return false;
  if(st.valorIncompativel && !(x.valorExecutadoBruto>0 && !x.oficial && !x.cancelado)) return false;
  if(st.search){
    const s = st.search.toLowerCase();
    const hay = [x.acao,x.especificacao,x.categoria,x.observacao,x.processo,x.area].filter(Boolean).join(' ').toLowerCase();
    if(!hay.includes(s)) return false;
  }
  return true;
}
function paRenderTable(container, list, showArea){

    if(av==null) av = typeof bv==='number' ? -Infinity : '';
    if(bv==null) bv = typeof av==='number' ? -Infinity : '';
    return av>bv?state.pa.sortDir : av<bv?-state.pa.sortDir : 0;

  const cols = showArea ? [{key:'area',label:'Área'}].concat(PA_TABLE_COLS) : PA_TABLE_COLS;
  container.innerHTML = `<table class="data-table"><thead><tr>${cols.map(c=>`<th data-col="${c.key}">${c.label} ${state.pa.sortCol===c.key?(state.pa.sortDir>0?'▲':'▼'):''}</th>`).join('')}</tr></thead>

  </tr>`).join('') || `<tr><td colspan="${cols.length}" class="cell-muted" style="padding:20px;text-align:center">Nenhuma ação corresponde aos filtros aplicados.</td></tr>`}</tbody></table>`;
  container.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
    const col=th.dataset.col;
    state.pa.sortDir = (state.pa.sortCol===col)?-state.pa.sortDir:1;

    <div class="donut-legend">${stats.map(s=>`<span><i style="background:${PA_AREA_COLOR[s.area]}"></i>${s.area} — ${fmtPct(total.valorExecOficial?s.valorExecOficial/total.valorExecOficial:0,0)}</span>`).join('')}</div>`;

  const maxSaldo = Math.max(...stats.map(s=>s.saldoAExecutar),1);
  document.getElementById('paPendenteBars').innerHTML = stats.slice().sort((a,b)=>b.saldoAExecutar-a.saldoAExecutar).map(s=>`
    <div class="bars-row"><span class="lbl">${s.area}</span><div class="bars-track"><div class="bars-fill" style="width:${s.saldoAExecutar/maxSaldo*100}%;background:var(--amber)"></div></div><span>${fmtBRL(s.saldoAExecutar)}</span></div>`).join('');
  const maxIncons = Math.max(...stats.map(s=>s.inconsistencias),1);
  document.getElementById('paInconsBars').innerHTML = stats.slice().sort((a,b)=>b.inconsistencias-a.inconsistencias).map(s=>`
    <div class="bars-row"><span class="lbl">${s.area}</span><div class="bars-track"><div class="bars-fill" style="width:${s.inconsistencias/maxIncons*100}%;background:var(--red)"></div></div><span>${s.inconsistencias}</span></div>`).join('');
}
function renderPAMatrixTable(el, stats, total){
  const rows = PA_MATRIX_ROWS;
  const bestWorstFor = row => {
    if(!row.best) return {best:null,worst:null};
    const vals = stats.map(s=>s[row.key]);
    const best = row.best==='max' ? Math.max(...vals) : Math.min(...vals);
    const worst = row.best==='max' ? Math.min(...vals) : Math.max(...vals);
    return {best,worst};
  };
  el.innerHTML = `<thead><tr><th>Indicador</th>${stats.map(s=>`<th class="num">${s.area}</th>`).join('')}<th class="num">Total</th></tr></thead>
  <tbody>${rows.map(row=>{
    const {best,worst} = bestWorstFor(row);
    return `<tr>
      <td>${row.label}</td>
      ${stats.map(s=>{
        const v = s[row.key];
        let cls='num';
        if(row.best && stats.length>1 && best!==worst){ if(v===best) cls+=' mx-best mx-link'; else if(v===worst) cls+=' mx-worst mx-link'; else cls+=' mx-link'; }
        else cls+=' mx-link';
        return `<td class="${cls}" data-area="${s.area}">${row.fmt(v)}</td>`;
      }).join('')}
      <td class="num">${row.fmt(total[row.key])}</td>
    </tr>`;
  }).join('')}</tbody>`;
  el.querySelectorAll('td.mx-link').forEach(td=>td.addEventListener('click',()=>setView('pa-'+td.dataset.area.toLowerCase())));
}

  const comInconsistencia = PA.filter(x=>x.temInconsistencia);
  const semProcesso = PA.filter(x=>!x.processo && !x.cancelado);
  const semCategoria = PA.filter(x=>!x.categoria);
  const tipoCounts = {};
  comInconsistencia.forEach(x=>x.inconsistencias.forEach(m=>{ const k=m.split('(')[0].trim(); tipoCounts[k]=(tipoCounts[k]||0)+1; }));
  const tiposOrdenados = Object.entries(tipoCounts).sort((a,b)=>b[1]-a[1]);
  const maxTipo = Math.max(...tiposOrdenados.map(t=>t[1]),1);

  c.innerHTML = `
  <div class="view-head"><div><h1>Qualidade dos Dados</h1><p>Cobertura de preenchimento e inconsistências identificadas nas ${PA.length} ações do PA.</p></div></div>

  <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
    ${paKpiCard({label:'Ações com inconsistência',val:comInconsistencia.length,sub:fmtPct(comInconsistencia.length/PA.length),tone:comInconsistencia.length?'bad':'good'})}
    ${paKpiCard({label:'Sem processo informado',val:semProcesso.length,sub:fmtPct(semProcesso.length/PA.length),tone:semProcesso.length?'warn':'good'})}
    ${paKpiCard({label:'Sem categoria/objeto',val:semCategoria.length,sub:fmtPct(semCategoria.length/PA.length),tone:semCategoria.length?'warn':'good'})}
    ${paKpiCard({label:'Impacto financeiro das inconsistências',val:fmtBRL(sum(comInconsistencia,'impactoFinanceiro')),tone:'bad',tooltip:'Soma do valor planejado das ações que apresentam ao menos uma inconsistência de preenchimento.'})}
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Qualidade dos dados por área</h3></div>
    <div class="panel-body">${stats.map(s=>{
      const qualidade = 1 - clamp01((s.semProcesso+s.semCategoria)/Math.max(s.totalAcoes,1));
      const color = qualidade>=0.8?'var(--green)':qualidade>=0.5?'var(--amber)':'var(--red)';
      return `<div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-size:12.4px;font-weight:700;color:var(--navy-900)"><span>${s.area}</span><span>${fmtPct(qualidade,0)}</span></div>
        <div class="quality-bar"><div class="quality-fill" style="width:${qualidade*100}%;background:${color}"></div></div>
        <div class="cell-muted" style="font-size:11px;margin-top:3px">${s.semProcesso} sem processo · ${s.semCategoria} sem categoria · ${s.inconsistencias} inconsistência(s) no total</div>
      </div>`;
    }).join('')}</div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Tipos de inconsistência mais frequentes</h3></div>
    <div class="panel-body">${tiposOrdenados.length ? tiposOrdenados.map(([tipo,n])=>`
      <div class="bars-row" style="grid-template-columns:280px 1fr 32px"><span class="lbl">${tipo}</span><div class="bars-track"><div class="bars-fill" style="width:${n/maxTipo*100}%;background:var(--red)"></div></div><span>${n}</span></div>`).join('') : '<p class="cell-muted">Nenhuma inconsistência identificada.</p>'}</div>
  </div>

  <div class="panel">
    <div class="panel-head"><div><h3>Ações com inconsistência — detalhamento</h3><div class="sub">Rastreável até a linha original da planilha (coluna "linha")</div></div></div>
    <div class="panel-body"><div class="table-wrap"><table class="data-table"><thead><tr><th>Linha</th><th>Área</th><th>Ação</th><th>Status</th><th class="num">Planejado</th><th class="num">Executado</th><th>Inconsistência(s)</th></tr></thead>
      <tbody>${comInconsistencia.map(x=>`<tr><td class="cell-muted">${x.linha}</td><td>${x.area}</td><td style="max-width:220px;white-space:normal">${esc(x.acao)}</td><td>${paStatusTag(x.status)}</td><td class="num">${fmtBRL(x.valorPlanejado)}</td><td class="num">${fmtBRL(x.valorExecutadoOficial)}</td><td class="cell-muted" style="max-width:260px;white-space:normal">${x.inconsistencias.map(esc).join(' · ')}</td></tr>`).join('') || `<tr><td colspan="7" class="cell-muted" style="text-align:center;padding:20px">Nenhuma inconsistência identificada.</td></tr>`}</tbody></table></div></div>
  </div>`;
}

/* =========================================================================================
   PÁGINA 6 — IMPORTAÇÃO E ATUALIZAÇÃO
========================================================================================= */
function renderPAImportacao(){
  const c = document.getElementById('content');
  const porArea = PA_AREAS.map(a=>({area:a, n:paItemsArea(a).length}));
  c.innerHTML = `
  <div class="view-head"><div><h1>Importação e Atualização</h1><p>Origem dos dados do módulo de Execução por Área.</p></div></div>

  <div class="panel">
    <div class="panel-head"><h3>Fonte de dados atual</h3></div>
    <div class="panel-body" style="font-size:12.6px;color:var(--gray-700);line-height:1.8">
      <p><strong>Arquivo de origem:</strong> CONTROLE EXECUCAO PA 2025 2026.xlsx</p>
      <p><strong>Ano de referência informado na planilha:</strong> 2026</p>
      <p><strong>Total de ações carregadas:</strong> ${PA.length}</p>
      <p><strong>Distribuição por área:</strong> ${porArea.map(p=>`${p.area}: ${p.n}`).join(' · ')}</p>
      <p>Os dados foram carregados a partir da planilha fornecida e embutidos na aplicação. Nenhum valor ausente na planilha foi preenchido ou estimado — campos não informados aparecem como "—" ou como pendência de qualidade de dados.</p>
    </div>
  </div>

  <div class="panel"><div class="placeholder-panel">
    ${icon('settings')}
    <h3>Em desenvolvimento</h3>
    <p>A exportação em CSV por área já está disponível em cada página. As etapas abaixo estão previstas para a próxima fase:</p>
    <ul>
      <li>Upload de nova planilha (.xlsx) diretamente pela interface, com recálculo automático de todos os indicadores</li>
      <li>Histórico de versões e comparação entre extrações sucessivas da planilha-fonte</li>
      <li>Validação automática de formato e colunas obrigatórias no momento da importação</li>
    </ul>
  </div></div>`;
}

/* =========================================================================================
   CONFIGURAÇÕES — thresholds do módulo PA (configurável, conforme seções 4/5/6/10)
========================================================================================= */
function renderPAConfig(){
  const c = document.getElementById('content');
  const f = PA_CONFIG.faixasExecucao, ri = PA_CONFIG.pesosRisco, fr = PA_CONFIG.faixasRisco, pi = PA_CONFIG.pesosIndice, sf = PA_CONFIG.semaforo;
  c.innerHTML = `
  <div class="view-head"><div><h1>Configurações</h1><p>Regras configuráveis do módulo de Execução por Área — faixas, pesos e limiares.</p></div></div>

  <div class="panel">
    <div class="panel-head"><div><h3>Faixas de execução financeira</h3><div class="sub">Limite superior de cada faixa (%) — seção 4</div></div></div>
    <div class="panel-body cfg-block">
      ${f.map((x,i)=>`<div class="cfg-row"><span>${x.label}</span><input type="number" min="0" max="100" step="1" data-fx="${i}" value="${(x.max*100).toFixed(0)>100?100:(x.max*100).toFixed(0)}"><span class="cfg-note">% máximo desta faixa</span></div>`).join('')}
    </div>

    <div class="panel-head"><div><h3>Pesos do Índice de Desempenho</h3><div class="sub">Devem somar 100% — seção 5</div></div></div>
    <div class="panel-body cfg-block">
      <div class="cfg-row"><span>Execução financeira ajustada</span><input type="number" min="0" max="100" id="cfgPiExec" value="${(pi.execFinanceira*100).toFixed(0)}"><span class="cfg-note">%</span></div>
      <div class="cfg-row"><span>Ações iniciadas</span><input type="number" min="0" max="100" id="cfgPiIniciadas" value="${(pi.iniciadas*100).toFixed(0)}"><span class="cfg-note">%</span></div>
      <div class="cfg-row"><span>Ações concluídas</span><input type="number" min="0" max="100" id="cfgPiConcluidas" value="${(pi.concluidas*100).toFixed(0)}"><span class="cfg-note">%</span></div>
      <div class="cfg-row"><span>Qualidade dos dados</span><input type="number" min="0" max="100" id="cfgPiQualidade" value="${(pi.qualidade*100).toFixed(0)}"><span class="cfg-note">%</span></div>
      <div class="cfg-row"><span>Regularidade dos registros</span><input type="number" min="0" max="100" id="cfgPiRegularidade" value="${(pi.regularidade*100).toFixed(0)}"><span class="cfg-note">%</span></div>
      <div class="cfg-note" id="cfgPiSum" style="margin-top:4px"></div>
    </div>

    <div class="panel-head"><div><h3>Semáforo gerencial</h3><div class="sub">Combina o índice de desempenho com pendências e inconsistências — seção 6</div></div></div>
    <div class="panel-body cfg-block">
      <div class="cfg-row"><span>Índice mínimo para Verde</span><input type="number" min="0" max="100" id="cfgSfVerde" value="${sf.verdeMin}"><span class="cfg-note">pontos</span></div>
      <div class="cfg-row"><span>Índice mínimo para Amarelo</span><input type="number" min="0" max="100" id="cfgSfAmarelo" value="${sf.amareloMin}"><span class="cfg-note">pontos (abaixo disso = Vermelho)</span></div>
      <div class="cfg-row"><span>% máximo de pendências p/ Verde</span><input type="number" min="0" max="100" id="cfgSfPend" value="${(sf.pendentesAltoPct*100).toFixed(0)}"><span class="cfg-note">%</span></div>
      <div class="cfg-row"><span>Máx. inconsistências p/ Verde</span><input type="number" min="0" id="cfgSfIncons" value="${sf.inconsistenciasAlerta}"><span class="cfg-note">ações</span></div>
    </div>

    <div class="panel-head"><div><h3>Pontuação de risco por ação</h3><div class="sub">Pontos por fator — seção 10</div></div></div>
    <div class="panel-body cfg-block">
      <div class="cfg-row"><span>Valor planejado elevado</span><input type="number" min="0" id="cfgRiValor" value="${ri.valorAlto}"><span class="cfg-note">pontos</span></div>
      <div class="cfg-row"><span>Limiar de "valor elevado"</span><input type="number" min="0" step="10000" id="cfgValorLimiar" value="${PA_CONFIG.valorAltoLimiar}"><span class="cfg-note">R$</span></div>
      <div class="cfg-row"><span>Status pendente</span><input type="number" min="0" id="cfgRiPendente" value="${ri.pendente}"><span class="cfg-note">pontos</span></div>
      <div class="cfg-row"><span>Ausência de execução</span><input type="number" min="0" id="cfgRiSemExec" value="${ri.semExecucao}"><span class="cfg-note">pontos</span></div>
      <div class="cfg-row"><span>Ausência de processo</span><input type="number" min="0" id="cfgRiSemProc" value="${ri.semProcesso}"><span class="cfg-note">pontos</span></div>
      <div class="cfg-row"><span>Inconsistência financeira</span><input type="number" min="0" id="cfgRiIncons" value="${ri.inconsistenciaFinanceira}"><span class="cfg-note">pontos</span></div>
      <div class="cfg-row"><span>Dados incompletos</span><input type="number" min="0" id="cfgRiDados" value="${ri.dadosIncompletos}"><span class="cfg-note">pontos</span></div>
      <div class="cfg-row"><span>Faixa Baixo/Moderado</span><input type="number" min="0" max="100" data-fr="0" value="${fr[0].max}"><span class="cfg-note">pontos (limite superior)</span></div>
      <div class="cfg-row"><span>Faixa Moderado/Alto</span><input type="number" min="0" max="100" data-fr="1" value="${fr[1].max}"><span class="cfg-note">pontos (limite superior)</span></div>
      <div class="cfg-row"><span>Faixa Alto/Crítico</span><input type="number" min="0" max="100" data-fr="2" value="${fr[2].max}"><span class="cfg-note">pontos (limite superior)</span></div>
    </div>

    <div class="cfg-actions">
      <button class="btn btn-primary" id="cfgSave">${icon('download')}Salvar configurações</button>
      <button class="btn btn-ghost" id="cfgReset">Restaurar padrões</button>
    </div>
  </div>

  <div class="panel"><div class="placeholder-panel">
    ${icon('settings')}
    <h3>Em desenvolvimento</h3>
    <ul>
      <li>Controle de permissões por perfil (gestor, coordenador de área, leitura)</li>
      <li>Conexão direta à planilha/base de origem (atualização automática)</li>
      <li>Personalização de campos, categorias e limites de capacidade</li>
    </ul>
  </div></div>`;

  const updateSum = ()=>{
    const s = ['cfgPiExec','cfgPiIniciadas','cfgPiConcluidas','cfgPiQualidade','cfgPiRegularidade'].reduce((a,id)=>a+Number(document.getElementById(id).value||0),0);
    const el = document.getElementById('cfgPiSum');
    el.textContent = `Soma atual: ${s}%` + (s!==100?' — ajuste para totalizar 100%':' ✓');
    el.style.color = s!==100 ? 'var(--red)' : 'var(--green)';
  };
  document.querySelectorAll('#cfgPiExec,#cfgPiIniciadas,#cfgPiConcluidas,#cfgPiQualidade,#cfgPiRegularidade').forEach(el=>el.addEventListener('input',updateSum));
  updateSum();

  document.getElementById('cfgSave').addEventListener('click',()=>{
    document.querySelectorAll('[data-fx]').forEach(inp=>{ PA_CONFIG.faixasExecucao[Number(inp.dataset.fx)].max = Math.min(100,Number(inp.value||0))/100; });
    PA_CONFIG.faixasExecucao[PA_CONFIG.faixasExecucao.length-1].max = 1.0001;
    PA_CONFIG.pesosIndice = {
      execFinanceira: Number(document.getElementById('cfgPiExec').value||0)/100,
      iniciadas: Number(document.getElementById('cfgPiIniciadas').value||0)/100,
      concluidas: Number(document.getElementById('cfgPiConcluidas').value||0)/100,
      qualidade: Number(document.getElementById('cfgPiQualidade').value||0)/100,
      regularidade: Number(document.getElementById('cfgPiRegularidade').value||0)/100
    };
    PA_CONFIG.semaforo = {
      verdeMin: Number(document.getElementById('cfgSfVerde').value||0),
      amareloMin: Number(document.getElementById('cfgSfAmarelo').value||0),
      pendentesAltoPct: Number(document.getElementById('cfgSfPend').value||0)/100,
      inconsistenciasAlerta: Number(document.getElementById('cfgSfIncons').value||0)
    };
    PA_CONFIG.pesosRisco = {
      valorAlto: Number(document.getElementById('cfgRiValor').value||0),
      pendente: Number(document.getElementById('cfgRiPendente').value||0),
      semExecucao: Number(document.getElementById('cfgRiSemExec').value||0),
      semProcesso: Number(document.getElementById('cfgRiSemProc').value||0),
      inconsistenciaFinanceira: Number(document.getElementById('cfgRiIncons').value||0),
      dadosIncompletos: Number(document.getElementById('cfgRiDados').value||0)
    };
    PA_CONFIG.valorAltoLimiar = Number(document.getElementById('cfgValorLimiar').value||0);
    document.querySelectorAll('[data-fr]').forEach(inp=>{ PA_CONFIG.faixasRisco[Number(inp.dataset.fr)].max = Number(inp.value||0); });
    toast('Configurações do módulo PA salvas — os indicadores serão recalculados nas próximas telas.');
  });
  document.getElementById('cfgReset').addEventListener('click',()=>{
    PA_CONFIG = paDefaultConfig();
    toast('Configurações restauradas para os valores padrão.');
    renderPAConfig();
  });
}

</script>
</body>
</html>
