<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Execução do PA 2025/2026 - SISD · Gestão</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --navy-900:#0A1B33;
  --navy-800:#0F2545;
  --navy-700:#163568;
  --accent:#0E9C95;
  --accent-600:#0B7E78;
  --accent-100:#E3F4F2;
  --blue-600:#2E6FB0;
  --blue-100:#E8F0FA;
  --orange:#C2660D;
  --orange-100:#FDEEDF;
  --slate:#5C6B85;
  --slate-100:#EEF1F6;
  --gray-50:#F7F9FB;
  --gray-100:#EEF1F5;
  --gray-200:#E2E7EE;
  --gray-300:#CFD7E2;
  --gray-500:#838FA1;
  --gray-600:#62708A;
  --gray-700:#42506A;
  --ink:#0F1726;
  --red:#C0392B;
  --red-100:#FBEAE8;
  --green:#1F8A57;
  --green-100:#E5F4EC;
  --amber:#B5790A;
  --amber-100:#FDF1DC;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(15,23,38,.05), 0 1px 1px rgba(15,23,38,.04);
  --shadow-md:0 8px 22px rgba(15,23,38,.09);
  --sidebar-w:252px;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--gray-50);color:var(--ink);}
body{font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.012em;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::selection{background:var(--accent-100);}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{background:linear-gradient(180deg,var(--navy-900),var(--navy-800));color:#CBD6E6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;}
.sidebar-brand{display:flex;align-items:center;gap:11px;padding:24px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--blue-600));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 10px rgba(14,156,149,.35);}
.brand-logo{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#fff;padding:3px;box-shadow:0 0 0 2px rgba(255,255,255,0.25);}
.brand-text{display:flex;flex-direction:column;line-height:1.22;}
.brand-text strong{color:#fff;font-size:14.8px;font-weight:700;letter-spacing:-.01em;}
.brand-text span{color:#7E8DA6;font-size:11px;}
.sidebar-nav{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:8px;color:#A9B7CC;text-decoration:none;font-size:13.3px;font-weight:500;border:none;background:transparent;width:100%;text-align:left;transition:background .12s,color .12s;}
.nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:rgba(14,156,149,.2);color:#fff;}
.nav-item.active svg{stroke:#3FD9CD;}
.sidebar-foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);}
.foot-org{display:flex;align-items:center;gap:9px;}
.foot-org-mark{width:28px;height:28px;border-radius:7px;background:#1A3D72;display:flex;align-items:center;justify-content:center;color:#9FC3E8;font-size:11px;font-weight:700;flex-shrink:0;}
.foot-org div strong{display:block;color:#DCE5F0;font-size:12px;}
.foot-org div span{color:#6E7E99;font-size:10.3px;}

/* ---------- Main / topbar ---------- */
.main{display:flex;flex-direction:column;min-width:0;}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--gray-200);padding:12px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--gray-100);border:1px solid var(--gray-200);border-radius:9px;padding:8px 12px;min-width:230px;flex:1;max-width:300px;}
.search-box svg{width:15px;height:15px;stroke:var(--gray-500);flex-shrink:0;}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;width:100%;color:var(--ink);}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;flex:2;}
.filter-select{border:1px solid var(--gray-200);background:#fff;border-radius:8px;padding:7px 10px;font-size:12.4px;color:var(--gray-700);min-width:118px;max-width:210px;}
.filter-select:focus{outline:2px solid var(--accent-100);}
.filter-select.is-active{border-color:var(--accent);color:var(--accent-600);font-weight:600;background:var(--accent-100);}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
.btn{display:flex;align-items:center;gap:7px;border-radius:8px;font-size:12.8px;font-weight:600;padding:8px 14px;border:1px solid transparent;white-space:nowrap;}
.btn svg{width:14px;height:14px;stroke:currentColor;}
.btn-primary{background:var(--navy-900);color:#fff;}
.btn-primary:hover{background:var(--navy-700);}
.btn-ghost{background:#fff;border-color:var(--gray-200);color:var(--gray-700);}
.btn-ghost:hover{background:var(--gray-100);}

.content{padding:22px 28px 64px;max-width:1500px;width:100%;margin:0 auto;}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:14px;flex-wrap:wrap;border-left:3px solid var(--accent);padding-left:12px;}
.view-head h1{font-size:21px;color:var(--navy-900);}
.view-head p{margin:4px 0 0;color:var(--gray-600);font-size:13px;}

/* ---------- Area tabs ---------- */
.area-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.area-tab{background:#fff;border:1px solid var(--gray-200);border-radius:11px;padding:11px 16px;cursor:pointer;text-align:left;min-width:150px;flex:1;transition:box-shadow .15s,border-color .15s,transform .15s;}
.area-tab:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.area-tab.active{border-color:var(--accent);background:var(--accent-100);}
.area-tab .at-label{font-size:12.8px;font-weight:700;color:var(--navy-900);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.area-tab .at-count{font-size:11px;font-weight:700;color:#fff;background:var(--gray-500);border-radius:10px;padding:1px 8px;}
.area-tab.active .at-count{background:var(--accent);}
.area-tab .at-sub{font-size:10.6px;color:var(--gray-600);margin-top:3px;line-height:1.35;}
.area-tab .at-bar{margin-top:8px;height:5px;border-radius:4px;background:var(--gray-100);overflow:hidden;}
.area-tab .at-bar i{display:block;height:100%;background:var(--accent);border-radius:4px;}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.kpi-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:14px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.kpi-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,var(--gray-200));opacity:.85;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.kpi-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.kpi-icon svg{width:15px;height:15px;stroke-width:1.8;}
.kpi-val{font-size:25px;font-weight:700;color:var(--navy-900);letter-spacing:-.02em;}
.kpi-label{font-size:11.7px;color:var(--gray-600);margin-top:2px;}
.kpi-sub{font-size:10.3px;color:var(--gray-500);margin-top:1px;}

/* status strip */
.status-strip{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.status-tile{flex:1;min-width:130px;background:#fff;border:1px solid var(--gray-200);border-radius:10px;padding:10px 14px;position:relative;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s;}
.status-tile:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.status-tile.active{border-color:var(--sc,var(--gray-300));box-shadow:0 0 0 2px var(--sc,var(--gray-300)) inset;}
.status-tile::before{content:"";position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--sc,var(--gray-300));}
.status-tile .sval{font-size:19px;font-weight:700;color:var(--navy-900);line-height:1;}
.status-tile .slabel{font-size:10.5px;color:var(--gray-600);margin-top:4px;font-weight:600;display:flex;align-items:center;gap:5px;}
.status-tile .dot{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--gray-400));flex-shrink:0;}

/* Generic panel */
.panel{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);margin-bottom:20px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--gray-100);gap:10px;flex-wrap:wrap;}
.panel-head h3{font-size:14.6px;color:var(--navy-900);}
.panel-head .sub{font-size:11.4px;color:var(--gray-500);margin-top:2px;font-weight:500;}
.panel-body{padding:0;}
.panel-body.pad{padding:16px 18px 18px;}

/* status tag */
.status-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.status-tag .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.area-badge{display:inline-flex;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--navy-900);color:#fff;letter-spacing:.02em;}

/* table */
.pa-table{width:100%;border-collapse:collapse;font-size:12.6px;}
.pa-table thead th{position:sticky;top:0;background:var(--gray-50);text-align:left;padding:10px 14px;font-size:10.8px;font-weight:700;color:var(--gray-600);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--gray-200);white-space:nowrap;}
.pa-table tbody tr.pa-row{border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background .12s;}
.pa-table tbody tr.pa-row:hover{background:var(--gray-50);}
.pa-table td{padding:10px 14px;vertical-align:top;color:var(--ink);}
.pa-table .nome-cell{font-weight:600;color:var(--navy-900);max-width:280px;}
.pa-table .num-cell{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
.pa-table .chev{width:14px;height:14px;stroke:var(--gray-500);transition:transform .15s;flex-shrink:0;}
.pa-table tr.expanded .chev{transform:rotate(90deg);}
.detail-row td{padding:0;border-bottom:1px solid var(--gray-100);}
.detail-row{display:none;}
.detail-row.show{display:table-row;}
.detail-box{background:var(--gray-50);padding:14px 18px 16px 40px;display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
.detail-box h4{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--gray-600);margin-bottom:5px;}
.detail-box p{margin:0 0 12px;font-size:12.6px;color:var(--gray-700);line-height:1.55;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
.detail-grid .dg-item span{display:block;font-size:10.3px;color:var(--gray-500);font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
.detail-grid .dg-item strong{font-size:12.8px;color:var(--navy-900);font-weight:650;}
.progress-mini{height:6px;border-radius:4px;background:var(--gray-200);overflow:hidden;margin-top:4px;}
.progress-mini i{display:block;height:100%;border-radius:4px;}
.empty-state{padding:40px 20px;text-align:center;color:var(--gray-500);font-size:13px;}
.name-wrap{display:flex;align-items:center;gap:8px;}

@media(max-width:1000px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .detail-box{grid-template-columns:1fr;}
  .app{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:-260px;transition:left .18s;}
  .sidebar.open{left:0;}
}
</style>
</head>

  const M = {
    search:'<svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
    download:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>',
    layers:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6"/></svg>',
    coin:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9"/><path d="M9 12h6M12 9v6"/></svg>',
    chart:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>',
    back:'<svg viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6"/></svg>',
    chev:'<svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6"/></svg>',
    doc:'<svg viewBox="0 0 24 24" fill="none"><path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4M9 12.3h6M9 16h6"/></svg>'
  };
  return M[name]||'';
}

function filteredActions(){
  const q = state.q.trim().toLowerCase();
  return ACTIONS.filter(a=>{
    if(state.area && a.area!==state.area) return false;
    if(state.status && a.status!==state.status) return false;
    if(q){
      const hay = [a.nome,a.objeto,a.especificacao,a.observacao].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function computeStats(list){
  const planejadas = list.length;
  const executadas = list.filter(a=>STATUS_META[a.status] && STATUS_META[a.status].executes).length;
  const valorPlanejado = list.reduce((s,a)=>s+(a.valorPlanejado||0),0);
  const valorExecutado = list.reduce((s,a)=> s + (STATUS_META[a.status] && STATUS_META[a.status].executes ? (a.valorExecutado||0):0),0);
  const byStatus = {};
  STATUS_ORDER.forEach(s=>byStatus[s]=0);
  list.forEach(a=>{ if(byStatus[a.status]!=null) byStatus[a.status]++; });
  return {
    planejadas, executadas, valorPlanejado, valorExecutado,
    pctFisico: planejadas? executadas/planejadas : 0,
    pctFinanceiro: valorPlanejado? valorExecutado/valorPlanejado : 0,
    byStatus
  };
}

function renderShell(){
  const app = document.getElementById('app');
  app.innerHTML = `
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="sisd-logo-nobg.png" class="brand-logo" alt="SISD" onerror="this.style.display='none'">
      <div class="brand-text"><strong>Saúde Digital - SISD</strong><span>Execução do PA</span></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <a class="nav-item active" href="execucao-pa.html">${icon('layers')}Execução do PA</a>
      <a class="nav-item" href="bi-portfolio.html">${icon('back')}Portfólio de Projetos</a>
    </nav>
    <div class="sidebar-foot">
      <div class="foot-org">
        <div class="foot-org-mark">BA</div>
        <div><strong>SESAB · Estado da Bahia</strong><span>Diretoria de Tecnologia</span></div>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" style="display:none">${icon('layers')}</button>
      <div class="search-box">${icon('search')}<input id="globalSearch" placeholder="Buscar ação, objeto ou processo..."></div>
      <div class="filter-row">
        <select class="filter-select" id="fStatus"><option value="">Status · todos</option></select>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btnClear">Limpar filtros</button>
        <button class="btn btn-ghost" id="btnExportPDF">${icon('doc')}Exportar PDF</button>
        <button class="btn btn-primary" id="btnExport">${icon('download')}Exportar CSV</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>`;

  fillSelect('fStatus', STATUS_ORDER.map(s=>({value:s,label:STATUS_META[s].label})));

  document.getElementById('globalSearch').addEventListener('input',e=>{state.q=e.target.value;renderContent();});
  document.getElementById('fStatus').addEventListener('change',e=>{state.status=e.target.value;markActive('fStatus');renderContent();});
  document.getElementById('btnClear').addEventListener('click',()=>{
    state.area='';state.status='';state.q='';
    document.getElementById('globalSearch').value='';
    document.getElementById('fStatus').value='';
    markActive('fStatus');
    renderContent();
  });
  document.getElementById('btnExport').addEventListener('click',exportCSV);
  document.getElementById('btnExportPDF').addEventListener('click',exportPDF);
}

function fillSelect(id, opts){
  const sel=document.getElementById(id);
  opts.forEach(o=>{
    const el=document.createElement('option');
    if(typeof o==='string'){ el.value=o; el.textContent=o; }
    else { el.value=o.value; el.textContent=o.label; }
    sel.appendChild(el);
  });
}
function markActive(id){ const el=document.getElementById(id); el.classList.toggle('is-active', !!el.value); }

function setArea(area){
  state.area = state.area===area ? '' : area;
  renderContent();
}
function setStatus(status){
  state.status = state.status===status ? '' : status;
  document.getElementById('fStatus').value = state.status;
  markActive('fStatus');
  renderContent();
}

function renderAreaTabs(){
  const totalAll = computeStats(ACTIONS);
  const tabs = [{key:'',label:'Todas as Áreas',sub:`${AREAS.length} coordenações/diretoria`}]
    .concat(AREAS.map(a=>({key:a,label:a,sub:AREA_LABEL[a]})));
  return `<div class="area-tabs">${tabs.map(t=>{
    const list = t.key? ACTIONS.filter(a=>a.area===t.key) : ACTIONS;
    const st = computeStats(list);
    const active = state.area===t.key;
    return `<button class="area-tab ${active?'active':''}" data-area="${t.key}">
      <div class="at-label"><span>${t.label}</span><span class="at-count">${st.planejadas}</span></div>
      <div class="at-sub">${t.sub}</div>
      <div class="at-bar"><i style="width:${(st.pctFisico*100).toFixed(1)}%"></i></div>
      <div class="at-sub" style="margin-top:4px">${st.executadas}/${st.planejadas} executadas · ${pct(st.pctFisico)}</div>
    </button>`;
  }).join('')}</div>`;
}

function kpiCard(color, iconName, val, label, sub){
  return `<div class="kpi-card" style="--kc:${color}">
    <div class="kpi-top">
      <div class="kpi-icon" style="background:${color}1a;color:${color}"><span style="color:${color};display:flex">${icon(iconName)}</span></div>
    </div>
    <div class="kpi-val">${val}</div>
    <div class="kpi-label">${label}</div>
    ${sub?`<div class="kpi-sub">${sub}</div>`:''}
  </div>`;
}

function renderKPIs(list){
  const st = computeStats(list);
  return `<div class="kpi-grid">
    ${kpiCard('var(--navy-900)','layers', fmtInt(st.planejadas), 'Ações Planejadas', fmtBRL(st.valorPlanejado)+' planejado')}
    ${kpiCard('var(--accent)','check', fmtInt(st.executadas), 'Ações Executadas', fmtBRL(st.valorExecutado)+' executado')}
    ${kpiCard('var(--blue-600)','chart', pct(st.pctFisico), '% Físico Executado', 'ações executadas / planejadas')}
    ${kpiCard('var(--green)','coin', pct(st.pctFinanceiro), '% Financeiro Executado', 'valor executado / planejado')}
  </div>`;
}

function renderStatusStrip(list){
  const st = computeStats(list);
  return `<div class="status-strip">${STATUS_ORDER.map(s=>{
    const meta = STATUS_META[s];
    const active = state.status===s;
    return `<div class="status-tile ${active?'active':''}" style="--sc:${meta.color}" data-status="${s}">
      <div class="sval">${st.byStatus[s]}</div>
      <div class="slabel"><span class="dot" style="background:${meta.color}"></span>${meta.label}</div>
    </div>`;
  }).join('')}</div>`;
}

function statusTag(s){
  const m = STATUS_META[s] || {label:s,color:'var(--gray-500)',bg:'var(--gray-100)'};
  return `<span class="status-tag" style="background:${m.bg};color:${m.color}"><span class="dot" style="background:${m.color}"></span>${m.label}</span>`;
}

function renderTable(list){
  if(!list.length){
    return `<div class="empty-state">Nenhuma ação encontrada para os filtros selecionados.</div>`;
  }
  const rows = list.map(a=>{
    const meta = STATUS_META[a.status]||{color:'var(--gray-400)'};
    const pctFin = a.valorPlanejado? (STATUS_META[a.status]&&STATUS_META[a.status].executes ? (a.valorExecutado||0)/a.valorPlanejado : 0) : 0;
    const isOpen = expanded.has(a.id);
    return `
    <tr class="pa-row ${isOpen?'expanded':''}" data-id="${a.id}">
      <td>${icon('chev')}</td>
      <td><span class="area-badge">${a.area}</span></td>
      <td class="nome-cell">${a.nome}</td>
      <td>${statusTag(a.status)}</td>
      <td class="num-cell">${fmtInt(a.qtdExecutada||0)} / ${fmtInt(a.qtdPlanejada||0)}</td>
      <td class="num-cell">${fmtBRL(a.valorPlanejado)}</td>
      <td class="num-cell">${fmtBRL((STATUS_META[a.status]&&STATUS_META[a.status].executes)?a.valorExecutado:0)}</td>
      <td class="num-cell">${pct(pctFin)}</td>
    </tr>
    <tr class="detail-row ${isOpen?'show':''}" data-detail="${a.id}">
      <td colspan="8">
        <div class="detail-box">
          <div>
            <h4>Justificativa</h4>
            <p>${a.justificativa||'—'}</p>
            <h4>Especificação do Item</h4>
            <p style="margin-bottom:0">${a.especificacao||'—'}</p>
          </div>
          <div class="detail-grid">
            <div class="dg-item"><span>Objeto</span><strong>${a.objeto||'—'}</strong></div>
            <div class="dg-item"><span>Contrato</span><strong>${a.contrato||'—'}</strong></div>
            <div class="dg-item"><span>Duração (meses)</span><strong>${a.duracaoMeses||'—'}</strong></div>
            <div class="dg-item"><span>Qtd. Planejada</span><strong>${fmtInt(a.qtdPlanejada||0)}</strong></div>
            <div class="dg-item"><span>Processo / Observação</span><strong>${a.observacao||'—'}</strong></div>
            <div class="dg-item">
              <span>% Financeiro Executado</span>
              <strong>${pct(pctFin)}</strong>
              <div class="progress-mini"><i style="width:${Math.min(100,pctFin*100).toFixed(1)}%;background:${meta.color}"></i></div>
            </div>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');

  return `<div style="overflow-x:auto">
  <table class="pa-table">
    <thead><tr>
      <th></th><th>Área</th><th>Ação</th><th>Status</th><th>Qtd. Exec./Planej.</th>
      <th>Valor Planejado</th><th>Valor Executado</th><th>% Financeiro</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderContent(){
  const list = filteredActions();
  const content = document.getElementById('content');
  const areaTitle = state.area ? `${state.area} · ${AREA_LABEL[state.area]}` : 'Todas as Áreas';
  content.innerHTML = `
    <div class="view-head">
      <div>
        <h1>Execução do Plano de Aquisições (PA) 2025/2026</h1>
        <p>SESAB · Coordenação-Geral de Tecnologia da Informação e Comunicação em Saúde — ${areaTitle}</p>
      </div>
    </div>
    ${renderAreaTabs()}
    ${renderKPIs(list)}
    ${renderStatusStrip(list)}
    <div class="panel">
      <div class="panel-head">
        <div>
          <h3>Ações Planejadas</h3>
          <div class="sub">${list.length} de ${ACTIONS.length} ações · clique em uma linha para ver detalhes</div>
        </div>
      </div>
      <div class="panel-body">${renderTable(list)}</div>
    </div>
  `;

  document.querySelectorAll('.area-tab').forEach(el=>el.addEventListener('click',()=>setArea(el.dataset.area)));
  document.querySelectorAll('.status-tile').forEach(el=>el.addEventListener('click',()=>setStatus(el.dataset.status)));
  document.querySelectorAll('.pa-row').forEach(el=>el.addEventListener('click',()=>{
    const id = Number(el.dataset.id);
    if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
    renderContent();
  }));
}

function exportCSV(){
  const list = filteredActions();
  const headers = ['Área','Nome da Ação','Status','Qtd. Planejada','Qtd. Executada','Valor Planejado','Valor Executado','Contrato','Duração (meses)','Objeto','Observação'];
  const rows = list.map(a=>[a.area,a.nome,STATUS_META[a.status]?STATUS_META[a.status].label:a.status,a.qtdPlanejada||0,a.qtdExecutada||0,a.valorPlanejado||0,a.valorExecutado||0,a.contrato||'',a.duracaoMeses||'',a.objeto||'',a.observacao||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';'));
  const csv = [headers.join(';'), ...rows].join('\n');
  const blob = new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `execucao-pa${state.area?'-'+state.area:''}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

const STATUS_HEX = {
  'PENDENTE':         '#B5790A',
  'EM EXECUÇÃO':      '#C2660D',
  'EXECUÇÃO PARCIAL': '#2E6FB0',
  'EXECUTADO':        '#1F8A57',
  'CANCELADO':        '#C0392B'
};

function exportPDF(){
  if(!window.jspdf || !window.jspdf.jsPDF){ alert('Biblioteca de PDF ainda carregando — tente novamente em alguns segundos.'); return; }
  const { jsPDF } = window.jspdf;
  const list = filteredActions();
  const st = computeStats(list);
  const areaTitle = state.area ? `${state.area} · ${AREA_LABEL[state.area]}` : 'Todas as Áreas';
  const doc = new jsPDF({ orientation:'landscape', unit:'pt', format:'a4' });
  const PW = doc.internal.pageSize.getWidth();
  const M = 32;

  function header(){
    doc.setFillColor(10,27,51);
    doc.rect(0,0,PW,64,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(15);
    doc.text('Execução do Plano de Aquisições (PA) 2025/2026', M, 28);
    doc.setFont('helvetica','normal');
    doc.setFontSize(9.5);
    doc.setTextColor(191,211,234);
    doc.text(`SESAB · CGTICS — ${areaTitle}`, M, 44);
    const genAt = new Date().toLocaleString('pt-BR');
    doc.setFontSize(8.5);
    doc.text(`Gerado em ${genAt}`, PW-M, 44, {align:'right'});
  }
  function footer(){
    const pages = doc.internal.getNumberOfPages();
    for(let i=1;i<=pages;i++){
      doc.setPage(i);
      doc.setFont('helvetica','normal');
      doc.setFontSize(8);
      doc.setTextColor(140,150,168);
      doc.text(`Saúde Digital · SISD — página ${i} de ${pages}`, PW/2, doc.internal.pageSize.getHeight()-14, {align:'center'});
    }
  }

  header();

  // KPI summary strip
  const kpis = [
    {label:'Ações Planejadas', val: fmtInt(st.planejadas)},
    {label:'Ações Executadas', val: fmtInt(st.executadas)},
    {label:'% Físico Executado', val: pct(st.pctFisico)},
    {label:'% Financeiro Executado', val: pct(st.pctFinanceiro)},
    {label:'Valor Planejado', val: fmtBRL(st.valorPlanejado)},
    {label:'Valor Executado', val: fmtBRL(st.valorExecutado)}
  ];
  const kpiY = 84;
  const colW = (PW-2*M)/kpis.length;
  kpis.forEach((k,i)=>{
    const x = M + i*colW;
    doc.setFont('helvetica','bold');
    doc.setFontSize(12.5);
    doc.setTextColor(10,27,51);
    doc.text(k.val, x, kpiY);
    doc.setFont('helvetica','normal');
    doc.setFontSize(7.6);
    doc.setTextColor(98,112,138);
    doc.text(k.label, x, kpiY+12, {maxWidth:colW-8});
  });
  doc.setDrawColor(226,231,238);
  doc.line(M, kpiY+22, PW-M, kpiY+22);

  const rows = list.map(a=>{
    const executes = STATUS_META[a.status] && STATUS_META[a.status].executes;
    const pctFin = a.valorPlanejado ? (executes ? (a.valorExecutado||0)/a.valorPlanejado : 0) : 0;
    return [
      a.area,
      a.nome,
      STATUS_META[a.status] ? STATUS_META[a.status].label : a.status,
      `${fmtInt(a.qtdExecutada||0)} / ${fmtInt(a.qtdPlanejada||0)}`,
      fmtBRL(a.valorPlanejado),
      fmtBRL(executes ? a.valorExecutado : 0),
      pct(pctFin)
    ];
  });

  doc.autoTable({
    startY: kpiY+34,
    margin:{top:76,left:M,right:M,bottom:34},
    head:[['Área','Ação','Status','Qtd. Exec./Planej.','Valor Planejado','Valor Executado','% Financeiro']],
    body: rows,
    styles:{ font:'helvetica', fontSize:8, cellPadding:5, textColor:[15,23,38], lineColor:[226,231,238], lineWidth:0.5 },
    headStyles:{ fillColor:[10,27,51], textColor:255, fontStyle:'bold', fontSize:8 },
    alternateRowStyles:{ fillColor:[247,249,251] },
    columnStyles:{
      0:{cellWidth:55},
      3:{halign:'right',cellWidth:70},
      4:{halign:'right',cellWidth:80},
      5:{halign:'right',cellWidth:80},
      6:{halign:'right',cellWidth:60}
    },
    didParseCell: data=>{
      if(data.section==='body' && data.column.index===2){
        const raw = list[data.row.index].status;
        const hex = STATUS_HEX[raw] || '#5C6B85';
        const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
        data.cell.styles.textColor = [r,g,b];
        data.cell.styles.fontStyle = 'bold';
      }
    },
    didDrawPage: header
  });

  footer();
  doc.save(`execucao-pa${state.area?'-'+state.area:''}.pdf`);
}

renderShell();
renderContent();
</script>
