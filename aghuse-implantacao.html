<title>Implantação AGHUse - SISD · Gestão</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
  --navy-900:#0A1B33;
  --navy-800:#0F2545;
  --navy-700:#163568;
  --accent:#0E9C95;
  --accent-600:#0B7E78;
  --accent-100:#E3F4F2;
  --blue-600:#2E6FB0;
  --blue-100:#E8F0FA;
  --orange:#C2660D;
  --orange-100:#FDEEDF;
  --slate:#5C6B85;
  --slate-100:#EEF1F6;
  --gray-50:#F7F9FB;
  --gray-100:#EEF1F5;
  --gray-200:#E2E7EE;
  --gray-300:#CFD7E2;
  --gray-500:#838FA1;
  --gray-600:#62708A;
  --gray-700:#42506A;
  --ink:#0F1726;
  --red:#C0392B;
  --red-100:#FBEAE8;
  --green:#1F8A57;
  --green-100:#E5F4EC;
  --amber:#B5790A;
  --amber-100:#FDF1DC;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(15,23,38,.05), 0 1px 1px rgba(15,23,38,.04);
  --shadow-md:0 8px 22px rgba(15,23,38,.09);
  --sidebar-w:252px;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--gray-50);color:var(--ink);}
body{font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.012em;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::selection{background:var(--accent-100);}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{background:linear-gradient(180deg,var(--navy-900),var(--navy-800));color:#CBD6E6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;}
.sidebar-brand{display:flex;align-items:center;gap:11px;padding:24px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand-logo{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#fff;padding:3px;box-shadow:0 0 0 2px rgba(255,255,255,0.25);}
.brand-text{display:flex;flex-direction:column;line-height:1.22;}
.brand-text strong{color:#fff;font-size:14.8px;font-weight:700;letter-spacing:-.01em;}
.brand-text span{color:#7E8DA6;font-size:11px;}
.sidebar-nav{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:8px;color:#A9B7CC;text-decoration:none;font-size:13.3px;font-weight:500;border:none;background:transparent;width:100%;text-align:left;transition:background .12s,color .12s;}
.nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:rgba(14,156,149,.2);color:#fff;}
.nav-item.active svg{stroke:#3FD9CD;}
.sidebar-foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);}
.foot-org{display:flex;align-items:center;gap:9px;}
.foot-org-mark{width:28px;height:28px;border-radius:7px;background:#1A3D72;display:flex;align-items:center;justify-content:center;color:#9FC3E8;font-size:11px;font-weight:700;flex-shrink:0;}
.foot-org div strong{display:block;color:#DCE5F0;font-size:12px;}
.foot-org div span{color:#6E7E99;font-size:10.3px;}

/* ---------- Main / topbar ---------- */
.main{display:flex;flex-direction:column;min-width:0;}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--gray-200);padding:12px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--gray-100);border:1px solid var(--gray-200);border-radius:9px;padding:8px 12px;min-width:260px;flex:1;max-width:380px;}
.search-box svg{width:15px;height:15px;stroke:var(--gray-500);flex-shrink:0;}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;width:100%;color:var(--ink);}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;flex:2;}
.filter-select{border:1px solid var(--gray-200);background:#fff;border-radius:8px;padding:7px 10px;font-size:12.4px;color:var(--gray-700);min-width:118px;max-width:210px;}
.filter-select:focus{outline:2px solid var(--accent-100);}
.filter-select.is-active{border-color:var(--accent);color:var(--accent-600);font-weight:600;background:var(--accent-100);}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
.btn{display:flex;align-items:center;gap:7px;border-radius:8px;font-size:12.8px;font-weight:600;padding:8px 14px;border:1px solid transparent;white-space:nowrap;}
.btn svg{width:14px;height:14px;stroke:currentColor;}
.btn-primary{background:var(--navy-900);color:#fff;}
.btn-primary:hover{background:var(--navy-700);}
.btn-ghost{background:#fff;border-color:var(--gray-200);color:var(--gray-700);}
.btn-ghost:hover{background:var(--gray-100);}

.content{padding:22px 28px 64px;max-width:1500px;width:100%;margin:0 auto;}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:14px;flex-wrap:wrap;border-left:3px solid var(--accent);padding-left:12px;}
.view-head h1{font-size:21px;color:var(--navy-900);}
.view-head p{margin:4px 0 0;color:var(--gray-600);font-size:13px;}

/* ---------- Situação tabs ---------- */
.sit-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.sit-tab{background:#fff;border:1px solid var(--gray-200);border-radius:11px;padding:11px 16px;cursor:pointer;text-align:left;min-width:150px;flex:1;transition:box-shadow .15s,border-color .15s,transform .15s;}
.sit-tab:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.sit-tab.active{border-color:var(--sc,var(--accent));background:var(--sbg,var(--accent-100));}
.sit-tab .st-label{font-size:12.8px;font-weight:700;color:var(--navy-900);display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sit-tab .st-count{font-size:11px;font-weight:700;color:#fff;background:var(--sc,var(--gray-500));border-radius:10px;padding:1px 8px;}
.sit-tab .st-sub{font-size:10.6px;color:var(--gray-600);margin-top:3px;}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.kpi-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-md);padding:14px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.kpi-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--kc,var(--gray-200));opacity:.85;}
.kpi-val{font-size:25px;font-weight:700;color:var(--navy-900);letter-spacing:-.02em;}
.kpi-label{font-size:11.7px;color:var(--gray-600);margin-top:2px;}
.kpi-sub{font-size:10.3px;color:var(--gray-500);margin-top:1px;}

/* Generic panel */
.panel{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);margin-bottom:20px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--gray-100);gap:10px;flex-wrap:wrap;}
.panel-head h3{font-size:14.6px;color:var(--navy-900);}
.panel-head .sub{font-size:11.4px;color:var(--gray-500);margin-top:2px;font-weight:500;}
.panel-body{padding:16px 18px 18px;}

/* tags/badges */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.tag .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.type-badge{display:inline-flex;font-size:10.3px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--slate-100);color:var(--gray-700);letter-spacing:.01em;}

/* unit cards grid */
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;}
.unit-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);overflow:hidden;transition:box-shadow .15s;}
.unit-card:hover{box-shadow:var(--shadow-md);}
.unit-head{padding:14px 16px 12px;cursor:pointer;}
.unit-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px;}
.unit-name{font-size:13.6px;font-weight:700;color:var(--navy-900);line-height:1.3;}
.unit-sigla{display:inline-flex;font-size:11px;color:var(--navy-900);font-weight:800;letter-spacing:.02em;margin-top:5px;background:var(--slate-100);border:1px solid var(--gray-200);border-radius:6px;padding:2px 8px;}
.unit-badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
.unit-progress{margin-top:8px;}
.progress-track{height:7px;border-radius:4px;background:var(--gray-100);overflow:hidden;}
.progress-track i{display:block;height:100%;border-radius:4px;background:var(--accent);}
.progress-label{display:flex;justify-content:space-between;font-size:10.5px;color:var(--gray-600);margin-top:4px;font-weight:600;}
.unit-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:11px;color:var(--gray-600);}
.unit-meta b{color:var(--navy-900);font-weight:700;}
.unit-meta svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;vertical-align:-2px;margin-right:2px;}
.unit-impedimento{margin-top:9px;font-size:11.3px;color:var(--gray-700);background:var(--gray-50);border-left:3px solid var(--amber);padding:7px 10px;border-radius:6px;line-height:1.4;}
.unit-toggle{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11.3px;font-weight:700;color:var(--accent-600);padding:9px;border-top:1px solid var(--gray-100);background:var(--gray-50);}
.unit-toggle svg{width:13px;height:13px;stroke:currentColor;transition:transform .15s;}
.unit-card.expanded .unit-toggle svg{transform:rotate(180deg);}
.unit-detail{display:none;padding:14px 16px 16px;border-top:1px solid var(--gray-100);}
.unit-card.expanded .unit-detail{display:block;}
.mod-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px;}
.mod-col h5{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--gray-500);margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.mod-col h5 .dot{width:6px;height:6px;border-radius:50%;}
.mod-chip{display:block;font-size:11px;color:var(--gray-700);padding:3px 0;}
.mod-empty{font-size:10.6px;color:var(--gray-400);font-style:italic;}
.detail-sub{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--gray-500);margin:10px 0 6px;}
.implantador-chip{display:inline-block;font-size:10.8px;background:var(--blue-100);color:var(--blue-600);padding:3px 9px;border-radius:12px;margin:0 5px 5px 0;font-weight:600;}
.imped-item{border-bottom:1px solid var(--gray-100);padding:8px 0;}
.imped-item:last-child{border-bottom:none;}
.imped-item .ii-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
.imped-item .ii-text{font-size:11.6px;color:var(--ink);line-height:1.4;flex:1;}
.imped-item .ii-obs{font-size:10.8px;color:var(--gray-600);margin-top:3px;}
.imped-item .ii-resp{font-size:10.3px;color:var(--gray-500);margin-top:3px;}
.empty-state{padding:40px 20px;text-align:center;color:var(--gray-500);font-size:13px;grid-column:1/-1;}

@media(max-width:1000px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .mod-cols{grid-template-columns:1fr;}
  .app{grid-template-columns:1fr;}
}
</style>

function unitProgress(u){ return TOTAL_MODULOS ? Math.min(1, u.modulosImplantados.length/TOTAL_MODULOS) : 0; }

function filteredUnits(){
  const q = state.q.trim().toLowerCase();
  return UNITS.filter(u=>{
    if(state.situacao && u.situacao!==state.situacao) return false;
    if(state.tipo && u.tipo!==state.tipo) return false;
    if(state.gestao && u.gestao!==state.gestao) return false;
    if(state.atraso && (u.atraso||'—')!==state.atraso) return false;
    if(q){
      const hay = [u.nome,u.sigla].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> unitProgress(b)-unitProgress(a) || a.nome.localeCompare(b.nome,'pt-BR'));
}

function computeStats(list){
  const total = list.length;
  const emAtraso = list.filter(u=>u.atraso==='Sim').length;
  const totalImpedAtivos = list.reduce((s,u)=>s+u.impedimentos.filter(i=>i.situacao==='Em aberto'||i.situacao==='Em atuação').length,0);
  const progressoGeral = total ? list.reduce((s,u)=>s+unitProgress(u),0)/total : 0;
  const bySit = {}; SIT_ORDER.forEach(s=>bySit[s]=0);
  list.forEach(u=>{ if(bySit[u.situacao]!=null) bySit[u.situacao]++; });
  return {total, emAtraso, totalImpedAtivos, progressoGeral, bySit};
}

      <div class="search-box">${icon('search')}<input id="globalSearch" placeholder="Buscar unidade por nome ou sigla..."></div>
      <div class="filter-row">
        <select class="filter-select" id="fSituacao"><option value="">Situação · todas</option></select>
        <select class="filter-select" id="fTipo"><option value="">Tipo · todos</option></select>
        <select class="filter-select" id="fGestao"><option value="">Gestão · todas</option></select>
        <select class="filter-select" id="fAtraso"><option value="">Atraso · todos</option></select>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btnClear">Limpar filtros</button>
        <button class="btn btn-ghost" id="btnExportPDF">${icon('doc')}Exportar PDF</button>
        <button class="btn btn-primary" id="btnExport">${icon('download')}Exportar CSV</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>`;

  fillSelect('fSituacao', SIT_ORDER.map(s=>({value:s,label:SIT_META[s].label})));
  fillSelect('fTipo', [...new Set(UNITS.map(u=>u.tipo).filter(Boolean))].sort());
  fillSelect('fGestao', [...new Set(UNITS.map(u=>u.gestao).filter(Boolean))].sort());
  fillSelect('fAtraso', [{value:'Sim',label:'Em atraso'},{value:'Não',label:'No prazo'},{value:'—',label:'Não informado'}]);

  document.getElementById('globalSearch').addEventListener('input',e=>{state.q=e.target.value;renderContent();});
  document.getElementById('fSituacao').addEventListener('change',e=>{state.situacao=e.target.value;markActive('fSituacao');renderContent();});
  document.getElementById('fTipo').addEventListener('change',e=>{state.tipo=e.target.value;markActive('fTipo');renderContent();});
  document.getElementById('fGestao').addEventListener('change',e=>{state.gestao=e.target.value;markActive('fGestao');renderContent();});
  document.getElementById('fAtraso').addEventListener('change',e=>{state.atraso=e.target.value;markActive('fAtraso');renderContent();});
  document.getElementById('btnClear').addEventListener('click',()=>{
    state.situacao='';state.tipo='';state.gestao='';state.atraso='';state.q='';
    document.getElementById('globalSearch').value='';
    ['fSituacao','fTipo','fGestao','fAtraso'].forEach(id=>{document.getElementById(id).value='';markActive(id);});
    renderContent();
  });
  document.getElementById('btnExport').addEventListener('click',exportCSV);
  document.getElementById('btnExportPDF').addEventListener('click',exportScreenPDF);
}

function fillSelect(id, opts){
  const sel=document.getElementById(id);
  opts.forEach(o=>{
    const el=document.createElement('option');
    if(typeof o==='string'){ el.value=o; el.textContent=o; }
    else { el.value=o.value; el.textContent=o.label; }
    sel.appendChild(el);
  });
}
function markActive(id){ const el=document.getElementById(id); el.classList.toggle('is-active', !!el.value); }

function setSituacao(s){
  state.situacao = state.situacao===s ? '' : s;
  document.getElementById('fSituacao').value = state.situacao;
  markActive('fSituacao');
  renderContent();
}

function kpiCard(color, val, label, sub){
  return `<div class="kpi-card" style="--kc:${color}">
    <div class="kpi-val">${val}</div>
    <div class="kpi-label">${label}</div>
    ${sub?`<div class="kpi-sub">${sub}</div>`:''}
  </div>`;
}

function renderKPIs(list){
  const st = computeStats(list);
  return `<div class="kpi-grid">
    ${kpiCard('var(--navy-900)', fmtInt(st.total), 'Unidades de Saúde', `de ${UNITS.length} no plano de implantação`)}
    ${kpiCard('var(--accent)', pct(st.progressoGeral), 'Progresso Médio de Implantação', `${TOTAL_MODULOS} módulos por unidade`)}
    ${kpiCard('var(--red)', fmtInt(st.emAtraso), 'Unidades em Atraso', st.total?pct(st.emAtraso/st.total)+' do total':'')}
    ${kpiCard('var(--amber)', fmtInt(st.totalImpedAtivos), 'Impedimentos Ativos', 'em aberto ou em atuação')}
  </div>`;
}

function renderSituacaoTabs(list){
  const st = computeStats(list);
  return `<div class="sit-tabs">${SIT_ORDER.map(s=>{
    const meta = SIT_META[s];
    const active = state.situacao===s;
    return `<button class="sit-tab ${active?'active':''}" style="--sc:${meta.color};--sbg:${meta.bg}" data-sit="${s}">
      <div class="st-label"><span>${meta.label}</span><span class="st-count" style="background:${meta.color}">${st.bySit[s]}</span></div>
      <div class="st-sub">unidades</div>
    </button>`;
  }).join('')}</div>`;
}

function tag(color,bg,label){
  return `<span class="tag" style="background:${bg};color:${color}"><span class="dot" style="background:${color}"></span>${label}</span>`;
}

function atrasoTag(a){
  if(a==='Sim') return tag('var(--red)','var(--red-100)','Em atraso');
  if(a==='Não') return tag('var(--green)','var(--green-100)','No prazo');
  return tag('var(--gray-500)','var(--gray-100)','Não informado');
}

function modColumn(title, dotColor, list){
  return `<div class="mod-col">
    <h5><span class="dot" style="background:${dotColor}"></span>${title} (${list.length})</h5>
    ${list.length? list.map(m=>`<span class="mod-chip">${m}</span>`).join('') : '<span class="mod-empty">Nenhum</span>'}
  </div>`;
}

function unitCard(u){
  const meta = SIT_META[u.situacao] || {label:u.situacao,color:'var(--gray-500)',bg:'var(--gray-100)'};
  const p = unitProgress(u);
  const isOpen = expanded.has(u.id);
  const impedAtivos = u.impedimentos.filter(i=>i.situacao==='Em aberto'||i.situacao==='Em atuação');

  return `<div class="unit-card ${isOpen?'expanded':''}" data-id="${u.id}">
    <div class="unit-head" data-toggle="${u.id}">
      <div class="unit-top">
        <div>
          <div class="unit-name">${u.nome}</div>
          <div class="unit-sigla">${u.sigla||'—'}</div>
        </div>
        ${tag(meta.color,meta.bg,meta.label)}
      </div>
      <div class="unit-badges">
        <span class="type-badge">${u.tipo||'—'}</span>
        <span class="type-badge">Gestão ${u.gestao||'—'}</span>
        ${u.porte?`<span class="type-badge">Porte ${u.porte}</span>`:''}
        ${atrasoTag(u.atraso)}
        ${impedAtivos.length? tag('var(--amber)','var(--amber-100)', impedAtivos.length+' impedimento(s) ativo(s)') : ''}
      </div>
      <div class="unit-progress">
        <div class="progress-track"><i style="width:${(p*100).toFixed(1)}%"></i></div>
        <div class="progress-label"><span>${u.modulosImplantados.length} de ${TOTAL_MODULOS} módulos implantados</span><span>${pct(p)}</span></div>
      </div>
      <div class="unit-meta">
        <span>${icon('users')} Implantadores: <b>${u.qtdAtual ?? '—'}/${u.qtdIdeal ?? '—'}</b> ${u.qtdFalta>0?`<span style="color:var(--red)">(faltam ${u.qtdFalta})</span>`:''}</span>
      </div>
      ${u.impedimentoPrincipal?`<div class="unit-impedimento">${u.impedimentoPrincipal}</div>`:''}
    </div>
    <div class="unit-toggle" data-toggle="${u.id}">${isOpen?'Ocultar detalhes':'Ver detalhes'} ${icon('chev')}</div>
    <div class="unit-detail">
      <div class="mod-cols">
        ${modColumn('Implantados','var(--green)',u.modulosImplantados)}
        ${modColumn('Em Implantação','var(--blue-600)',u.modulosEmImplantacao)}
        ${modColumn('A Implantar','var(--gray-500)',u.modulosAImplantar)}
      </div>
      ${u.implantadores.length?`<div class="detail-sub">Implantadores (${u.implantadores.length})</div>
      <div>${u.implantadores.map(n=>`<span class="implantador-chip">${n}</span>`).join('')}</div>`:''}
      ${u.impedimentos.length?`<div class="detail-sub">Impedimentos (${u.impedimentos.length})</div>
      <div>${u.impedimentos.map(i=>`<div class="imped-item">
        <div class="ii-top"><span class="ii-text">${i.item}</span>${tag(
          i.situacao==='Resolvido'?'var(--green)':i.situacao==='Em aberto'?'var(--red)':i.situacao&&i.situacao.startsWith('Arquiv')?'var(--gray-500)':'var(--amber)',
          i.situacao==='Resolvido'?'var(--green-100)':i.situacao==='Em aberto'?'var(--red-100)':i.situacao&&i.situacao.startsWith('Arquiv')?'var(--gray-100)':'var(--amber-100)',
          i.situacao||'—'
        )}</div>
        ${i.observacao?`<div class="ii-obs">${i.observacao}</div>`:''}
        ${i.responsavel?`<div class="ii-resp">Responsável: ${i.responsavel}</div>`:''}
      </div>`).join('')}</div>`:''}
    </div>
  </div>`;
}

function renderUnits(list){
  if(!list.length){
    return `<div class="units-grid"><div class="empty-state">Nenhuma unidade encontrada para os filtros selecionados.</div></div>`;
  }
  return `<div class="units-grid">${list.map(unitCard).join('')}</div>`;
}

function renderContent(){
  const list = filteredUnits();
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="view-head">
      <div>
        <h1>Implantação do AGHUse nas Unidades de Saúde</h1>
        <p>SESAB · Sistema de Gestão Hospitalar — acompanhamento por unidade</p>
      </div>
    </div>
    ${renderSituacaoTabs(list)}
    ${renderKPIs(list)}
    <div class="panel">
      <div class="panel-head">
        <div>
          <h3>Unidades de Saúde</h3>
          <div class="sub">${list.length} de ${UNITS.length} unidades · clique em uma unidade para ver módulos, implantadores e impedimentos</div>
        </div>
      </div>
      <div class="panel-body">${renderUnits(list)}</div>
    </div>
  `;

  document.querySelectorAll('.sit-tab').forEach(el=>el.addEventListener('click',()=>setSituacao(el.dataset.sit)));
  document.querySelectorAll('[data-toggle]').forEach(el=>el.addEventListener('click',()=>{
    const id = Number(el.dataset.toggle);
    if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
    renderContent();
  }));
}

function exportCSV(){
  const list = filteredUnits();
  const headers = ['Ciclo','Tipo','Unidade','Sigla','Porte','Gestão','Situação','Em Atraso','Impedimento Principal','Implantadores Ideal','Implantadores Atual','Implantadores Falta','Módulos Implantados','Módulos Em Implantação','Módulos A Implantar','% Implantação'];
  const rows = list.map(u=>[
    u.ciclo||'', u.tipo||'', u.nome, u.sigla||'', u.porte||'', u.gestao||'', u.situacao||'', u.atraso||'—',
    u.impedimentoPrincipal||'', u.qtdIdeal??'', u.qtdAtual??'', u.qtdFalta??'',
    u.modulosImplantados.join(' | '), u.modulosEmImplantacao.join(' | '), u.modulosAImplantar.join(' | '),
    pct(unitProgress(u))
  ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';'));
  const csv = [headers.join(';'), ...rows].join('\n');
  const blob = new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `aghuse-implantacao${state.situacao?'-'+state.situacao:''}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

let SISD_LOGO_WHITE_B64 = null;
(async()=>{ try{ const r=await fetch("sisd-logo-white.png",{cache:"force-cache"}); const blob=await r.blob(); const reader=new FileReader(); reader.onload=()=>{ SISD_LOGO_WHITE_B64=reader.result; }; reader.readAsDataURL(blob); }catch(e){} })();

async function exportScreenPDF(){
  if(!window.jspdf || !window.jspdf.jsPDF){ alert('Biblioteca de PDF ainda carregando — tente novamente em alguns segundos.'); return; }
  if(!window.html2canvas){ alert('Biblioteca de captura ainda carregando — tente novamente em alguns segundos.'); return; }
  const content = document.getElementById('content');
  const btn = document.getElementById('btnExportPDF');
  if(!content) return;
  const filterBits = [];
  if(state.situacao) filterBits.push(SIT_META[state.situacao].label);
  if(state.tipo) filterBits.push(state.tipo);
  if(state.gestao) filterBits.push('Gestão '+state.gestao);
  if(state.atraso) filterBits.push(state.atraso==='Sim'?'Em atraso':state.atraso==='Não'?'No prazo':'Atraso não informado');
  if(state.q) filterBits.push(`Busca: "${state.q}"`);
  const subtitle = filterBits.length ? filterBits.join(' · ') : 'Todas as unidades';

  try{
    if(btn){ btn.disabled = true; btn.innerHTML = `${icon('doc')}Gerando PDF...`; }
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));

    const canvas = await html2canvas(content, {
      backgroundColor: '#F7F9FB',
      scale: Math.min(3, Math.max(2, window.devicePixelRatio || 2)),
      useCORS: true,
      allowTaint: true,
      logging: false,
      scrollX: 0,
      scrollY: -window.scrollY,
      windowWidth: Math.max(document.documentElement.scrollWidth, content.scrollWidth),
      windowHeight: Math.max(content.scrollHeight, document.documentElement.clientHeight)
    });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation:'landscape', unit:'pt', format:'a3' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const margin = 22;
    const headerH = 52;
    const footerH = 18;
    const imgW = pageW - margin*2;
    const usableH = pageH - headerH - margin - footerH;
    const sourcePageH = Math.floor(usableH * canvas.width / imgW);

    /* Corta entre unidades/painéis, nunca no meio de um card */
    const contentRect = content.getBoundingClientRect();
    const scaleY = canvas.height / content.scrollHeight;
    const rootSel = '.unit-card, .kpi-card, .kpi-grid, .sit-tabs, .panel-head, .view-head';

    const cardTopsPx = [0];
    content.querySelectorAll(rootSel).forEach(el=>{
      const parent = el.parentElement?.closest(rootSel.split(',').map(s=>s.trim()).join(','));
      if(parent) return;
      const r = el.getBoundingClientRect();
      const top = Math.round((r.top - contentRect.top + content.scrollTop) * scaleY);
      if(top > 20) cardTopsPx.push(top);
    });
    cardTopsPx.sort((a,b)=>a-b);

    function getSlice(srcY){
      const limit = srcY + sourcePageH;
      if(limit >= canvas.height) return canvas.height - srcY;
      for(const top of cardTopsPx){
        if(top > limit) return top - srcY;
      }
      return sourcePageH;
    }

    const pageCanvas = document.createElement('canvas');
    const pageCtx = pageCanvas.getContext('2d');
    pageCanvas.width = canvas.width;

    const pages = [];
    let srcY = 0;
    while(srcY < canvas.height){
      const sliceH = Math.max(getSlice(srcY), 10);
      pageCanvas.height = sliceH;
      pageCtx.fillStyle = '#F7F9FB';
      pageCtx.fillRect(0,0,pageCanvas.width,sliceH);
      pageCtx.drawImage(canvas,0,srcY,canvas.width,sliceH,0,0,canvas.width,sliceH);
      pages.push({data:pageCanvas.toDataURL('image/png',1), height:sliceH*imgW/canvas.width});
      srcY += sliceH;
    }

    pages.forEach((page,idx)=>{
      if(idx>0) pdf.addPage();
      pdf.setFillColor(10,27,51);
      pdf.rect(0,0,pageW,headerH,'F');
      if(SISD_LOGO_WHITE_B64){ try{ pdf.addImage(SISD_LOGO_WHITE_B64,'PNG',margin,4,44,44); }catch(e){} }
      pdf.setTextColor(255,255,255);
      pdf.setFont('helvetica','bold'); pdf.setFontSize(13);
      pdf.text('Saúde Digital - SISD · Implantação AGHUse', margin+50, 22);
      pdf.setFont('helvetica','normal'); pdf.setFontSize(9);
      pdf.text(subtitle, margin+50, 38);
      pdf.setFontSize(8);
      pdf.text(new Date().toLocaleDateString('pt-BR'), pageW-margin, 38, {align:'right'});
      pdf.addImage(page.data,'PNG',margin,headerH+4,imgW,page.height,undefined,'MEDIUM');
      pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(120,130,145);
      pdf.text(`Saúde Digital - SISD — Implantação AGHUse — página ${idx+1} de ${pages.length}`, margin, pageH-6);
    });

    pdf.save(`aghuse-implantacao${state.situacao?'-'+state.situacao:''}.pdf`);
  }catch(err){
    console.error(err);
    alert('Não foi possível gerar o PDF da tela atual.');
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = `${icon('doc')}Exportar PDF`; }
  }
}

renderShell();
renderContent();
</script>
